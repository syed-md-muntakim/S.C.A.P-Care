name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:          # all target branches (Foundation, Core_Appointment, ... and main)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SmartClinic.Web
      - run: dotnet build SmartClinic.Web -c Release --no-restore
      - run: dotnet publish SmartClinic.Web -c Release -o ./publish
      - name: Deploy via FTP (main only, when enabled)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/